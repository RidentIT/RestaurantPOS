version: 2
updates:
  # Frontend — npm packages
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Core Desktop Framework updates in a separate PR for focused testing
      core-frameworks:
        patterns:
          - "react*"
          - "vite*"
          - "@vitejs/*"
          - "electron*"
          - "typescript*"
        update-types:
          - "minor"
          - "patch"

      # All general utilities & UI libraries bundled into a single batch
      general-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "react*"
          - "vite*"
          - "@vitejs/*"
          - "electron*"
          - "typescript*"
        update-types:
          - "minor"
          - "patch"

    ignore:
      # Ignore all major breaking updates (upgraded manually on demand)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Backend — NuGet packages
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      nuget-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore all major breaking updates (upgraded manually on demand)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — keep workflow action versions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      actions-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
