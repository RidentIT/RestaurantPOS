name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore dependencies
        run: dotnet restore
        working-directory: backend

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend

      - name: Run Unit Tests
        run: dotnet test tests/RestaurantPOS.UnitTests --no-build --configuration Release --collect:"XPlat Code Coverage"
        working-directory: backend

      - name: Run Architecture Tests
        run: dotnet test tests/RestaurantPOS.ArchitectureTests --no-build --configuration Release
        working-directory: backend

      - name: Run Integration Tests
        run: dotnet test tests/RestaurantPOS.IntegrationTests --no-build --configuration Release
        working-directory: backend

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/**/TestResults/**/coverage.cobertura.xml