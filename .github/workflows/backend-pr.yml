name: Backend PR Checks

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-pr.yml'

jobs:
  pr-validation:
    runs-on: ubuntu-latest

    # Expose secret as job-level env so steps can check if it is set
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BACKEND }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore dependencies
        run: dotnet restore
        working-directory: backend

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend

      - name: Run Unit Tests
        run: >
          dotnet test tests/RestaurantPOS.UnitTests
          --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        working-directory: backend

      - name: Run Architecture Tests
        run: dotnet test tests/RestaurantPOS.ArchitectureTests --no-build --configuration Release
        working-directory: backend

      - name: Run Integration Tests
        run: >
          dotnet test tests/RestaurantPOS.IntegrationTests
          --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        working-directory: backend

      - name: Setup Java (required by SonarCloud scanner)
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SonarCloud scanner
        if: env.SONAR_TOKEN != ''
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SonarCloud PR Analysis
        if: env.SONAR_TOKEN != ''
        run: |
          dotnet sonarscanner begin \
            /k:"RidentIT_RestaurantPOS" \
            /o:"ridentit" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN_BACKEND }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.pullrequest.key="${{ github.event.pull_request.number }}" \
            /d:sonar.pullrequest.branch="${{ github.head_ref }}" \
            /d:sonar.pullrequest.base="${{ github.base_ref }}"

          dotnet build --no-restore --configuration Release

          dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN_BACKEND }}"
        working-directory: backend
